[project]
name = "slm-finetuning"
version = "0.1.0"
description = "Fine-tuning Small Language Models with LoRA/QLoRA"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
