# LoRA 8-bit Fine-Tuning Configuration
# Usage: python scripts/train.py --config configs/lora_8bit_config.yaml
# Uses 8-bit quantization — more VRAM than 4-bit but better quality

# Model
model:
  name: "microsoft/phi-2"
  revision: "main"
  torch_dtype: "bfloat16"
  device_map: "auto"
  attn_implementation: "flash_attention_2"

# Quantization (8-bit)
quantization:
  enabled: true
  bits: 8                                    # 8-bit quantization via bitsandbytes
  quant_type: "nf4"                          # Ignored for 8-bit, kept for compat
  double_quant: false

# LoRA Configuration
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset
dataset:
  name: "yahma/alpaca-cleaned"
  split: "train"
  format: "alpaca"
  max_length: 2048
  val_split: 0.05
  num_proc: 4

# Training
training:
  output_dir: "models/phi2-lora-8bit"
  num_epochs: 3
  per_device_batch_size: 2                   # Lower batch size for 8-bit (uses more VRAM)
  gradient_accumulation_steps: 8             # Effective batch size = 2 * 8 = 16
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.001
  max_grad_norm: 0.3
  fp16: false
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"                  # 8-bit optimizer to save memory
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  seed: 42
  report_to: "wandb"

# Weights & Biases
wandb:
  project: "slm-finetuning"
  run_name: null
  tags: ["lora", "8bit", "phi-2"]
